spring.datasource.url=jdbc:h2:mem:grabthisforme-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

grabthisforme.auth.access-token-expire-seconds=900
grabthisforme.auth.refresh-token-expire-seconds=2592000
grabthisforme.auth.session-absolute-expire-days=90
grabthisforme.auth.revoked-retention-days=30

# Tests invoke retention explicitly with a controlled clock.
grabthisforme.chat.cleanup-enabled=false

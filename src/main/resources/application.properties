spring.application.name=GrabThisForMe
server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:file:./data/grabthisforme;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.default-property-inclusion=non_null

grabthisforme.auth.access-token-expire-seconds=900
grabthisforme.auth.refresh-token-expire-seconds=2592000
grabthisforme.auth.session-absolute-expire-days=90
grabthisforme.auth.revoked-retention-days=30
grabthisforme.cors.allowed-origins=*

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.web-allow-others=true
# Bounded image upload; configure a persistent media directory in deployment.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

# Chat messages and private attachments only; public/topic media are not expired.
grabthisforme.chat.retention-days=30
grabthisforme.chat.cleanup-enabled=true
grabthisforme.chat.cleanup-interval-ms=3600000
grabthisforme.chat.cleanup-initial-delay-ms=60000
